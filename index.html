<!DOCTYPE html>
<html>

<head>
    <title>Registro de alumnos</title>
</head>

<body>

    <h1>Registro de alumnos</h1>

    <label>Nombre:</label>
    <input type="text" id="nombre">

    <br><br>

    <label>Año:</label>
    <select id="anio">
        <option>1ro</option>
        <option>2do</option>
        <option>3ro</option>
        <option>4to</option>
        <option>5to</option>
        <option>6to</option>
    </select>

    <br><br>

    <label>División:</label>
    <select id="division">
        <option>1ra</option>
        <option>2da</option>
        <option>3ra</option>
        <option>4ta</option>
        <option>5ta</option>
        <option>6ta</option>
        <option>7ma</option>
        <option>8va</option>
        <option>9na</option>
        <option>10ma</option>
    </select>

    <br><br>

    <button onclick="agregarAlumno()">Agregar alumno</button>

    <h2>Alumnos cargados</h2>

    <ul id="lista"></ul>

    <script src="alumno.js"></script>
    <script src="script.js"></script>

</body>

</html>
