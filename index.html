<!DOCTYPE html>
<html>

<head>
    <title>Registro de alumnos</title>
</head>

<body>

    <h1>Registro de alumnos</h1>

    <form>

        <label>Nombre:</label>
        <input type="text" name="nombre">

        <br><br>

        <label>Año:</label>
        <select name="anio">
            <option>1ro</option>
            <option>2do</option>
            <option>3ro</option>
            <option>4to</option>
            <option>5to</option>
            <option>6to</option>
        </select>

        <br><br>

        <label>División:</label>
        <select name="division">
            <option>1ra</option>
            <option>2da</option>
            <option>3ra</option>
            <option>4ta</option>
            <option>5ta</option>
            <option>6ta</option>
            <option>7ma</option>
            <option>8va</option>
            <option>9na</option>
            <option>10ma</option>
        </select>

        <br><br>

        <button type="button"
            onclick="agregarAlumno(this.form.nombre.value, this.form.anio.value, this.form.division.value)">
            Agregar alumno
        </button>

    </form>


    <script>

        function agregarAlumno(nombre, anio, division) {

            if (nombre == "") {
                alert("Ingrese un nombre");
            }
            else {
                alert("Alumno: " + nombre + "\nAño: " + anio + "\nDivisión: " + division);
            }

        }

    </script>

</body>

</html>
